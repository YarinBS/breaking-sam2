# Model IDs, checkpoint, and thresholds. The code reads every value from here.
models:
  sam2_config: configs/sam2.1/sam2.1_hiera_b+.yaml
  sam2_checkpoint: ../checkpoints/sam2.1_hiera_base_plus.pt
  sam2_checkpoint_url: https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_base_plus.pt
  grounding_dino_model_id: IDEA-Research/grounding-dino-tiny
  grounding_dino_cache_dir: ../checkpoints/huggingface

runtime:
  offload_video_to_cpu: true

thresholds:
  box: 0.35
  text: 0.25
  nms: 0.50
  mask_logit: 0.0
  boundary_tolerance: 0.008
  failure_iou: 0.50
  failure_consecutive: 2
